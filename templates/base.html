<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}سلة SHEIN{% endblock %}</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:#f5f5f7;color:#222}
nav{background:#111;color:#fff;padding:12px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
nav a{color:#fff;text-decoration:none}
nav .sp{flex:1}
main{max-width:1000px;margin:20px auto;padding:0 14px}
.flash{background:#fff3cd;border:1px solid #ffe08a;padding:10px 14px;border-radius:8px;margin-bottom:12px}
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 4px #0001}
input[type=text],input[type=email],input[type=password],input[type=url]{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:15px;margin:6px 0 12px}
button,.btn{background:#111;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block}
button.light{background:#e5e5ea;color:#111}
button.red{background:#c62828}
button:disabled{background:#aaa;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin:14px 0}
.prod{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px #0001;display:flex;flex-direction:column}
.prod img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#eee}
.prod .b{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}
.name{font-size:14px;line-height:1.5}
.var{font-size:13px;color:#555;background:#f0f0f3;padding:4px 8px;border-radius:6px}
.price{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.price .now{font-size:18px;font-weight:700;color:#c62828}
.price del{color:#888;font-size:14px}
.badge{background:#c62828;color:#fff;border-radius:6px;padding:2px 7px;font-size:12px;font-weight:700}
.sold{background:#999;color:#fff;border-radius:6px;padding:2px 7px;font-size:12px}
.total{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.total b{font-size:22px}
pre{background:#0f172a;color:#e2e8f0;padding:14px;border-radius:10px;overflow:auto;direction:ltr;text-align:left;font-size:13px;max-height:420px}
.row{display:flex;gap:12px;background:#fff;border-radius:12px;padding:10px;margin-bottom:10px;box-shadow:0 1px 4px #0001}
.row img{width:90px;height:120px;object-fit:cover;border-radius:8px;background:#eee}
.row .info{flex:1;display:flex;flex-direction:column;gap:6px}
.qty{display:flex;align-items:center;gap:8px}
.qty form{margin:0}
.qty button{padding:4px 12px}
</style>
</head>
<body>
<nav>
  <a href="/"><b>SHEIN Cart</b></a>
  {% if session.uid %}
    <a href="{{ url_for('order') }}">طلب أوردر</a>
    <a href="{{ url_for('cart') }}">عربتي ({{ cart_n }})</a>
    <span class="sp"></span>
    <span>{{ session.email }}</span>
    <a href="{{ url_for('logout') }}">خروج</a>
  {% else %}
    <span class="sp"></span>
    <a href="{{ url_for('login') }}">دخول</a>
    <a href="{{ url_for('register') }}">حساب جديد</a>
  {% endif %}
</nav>
<main>
{% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}
{% block body %}{% endblock %}
</main>
</body>
</html>
