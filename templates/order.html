{% extends "base.html" %}
{% block body %}
<div class="card">
  <h2>طلب أوردر</h2>
  <p>الصق رسالة المشاركة زي ما نسختها من SHEIN (أو الرابط لوحده). هيلقط رابط SHEIN منها ويتجاهل باقي الكلام.</p>
  <form method="post" onsubmit="this.querySelector('button').disabled=true;this.querySelector('button').textContent='جاري الاستخراج... (ممكن ياخد نص دقيقة)'">
    <textarea name="url" rows="6" required placeholder="I found some great items at SHEIN! ... https://onelink.shein.com/..." style="width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:15px;margin:6px 0 12px;font-family:inherit"></textarea>
    <button type="submit">استخراج المنتجات</button>
  </form>
</div>
{% endblock %}
